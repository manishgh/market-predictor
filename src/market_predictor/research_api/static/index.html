<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Predictor Research</title>
  <link rel="stylesheet" href="/assets/index.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Market Predictor</h1>
      <p>Research scoring workbench</p>
    </div>
    <span class="boundary-badge">Research only</span>
  </header>

  <main class="workspace">
    <section class="controls" aria-labelledby="controls-title">
      <h2 id="controls-title">Prediction request</h2>

      <label for="model-select">Model</label>
      <select id="model-select" disabled>
        <option>Loading model catalog...</option>
      </select>
      <p id="model-status" class="field-status" aria-live="polite"></p>

      <label for="tickers">US tickers</label>
      <textarea
        id="tickers"
        rows="4"
        autocomplete="off"
        spellcheck="false"
        placeholder="Enter comma-separated US tickers"
      ></textarea>

      <button id="execute-btn" type="button" disabled>
        Run research score
      </button>
      <p id="request-status" class="request-status" role="status" aria-live="polite"></p>
    </section>

    <section class="results" aria-labelledby="results-title">
      <div class="results-heading">
        <div>
          <h2 id="results-title">Ranked evidence</h2>
          <p id="result-context">No request has been run.</p>
        </div>
        <span id="result-count" class="count">0</span>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Ticker</th>
              <th scope="col">Research score</th>
              <th scope="col">Feature time</th>
              <th scope="col">Feature evidence</th>
            </tr>
          </thead>
          <tbody id="prediction-rows">
            <tr><td colspan="5" class="empty">Awaiting a valid request.</td></tr>
          </tbody>
        </table>
      </div>

      <section class="rejections" aria-labelledby="rejections-title">
        <h3 id="rejections-title">Unavailable tickers</h3>
        <ul id="rejection-list"><li>None</li></ul>
      </section>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
