[strategies."INTRADAY.OPENING_RANGE_BREAKOUT.60M.V1"]
direction = "long"
horizon_minutes = 60
session_segment = "late_opening"
first_decision_minute_et = 600
last_decision_minute_et_exclusive = 690
minimum_setup_spacing_minutes = 60
deterministic_score = "opening_breakout_confirmation"
estimator_families = ["deterministic_baseline", "logistic", "hist_gradient_boosting"]
selection_policies = ["model_score_only", "catalyst_confirmation_overlay"]

