schema_version = "primary_v2.failure_attribution.v1"
validation_scopes = ["walk_forward", "ticker_holdout"]
bootstrap_iterations = 1000
bootstrap_seed = 47
minimum_rows_per_scope = 200
minimum_sessions_per_scope = 60
minimum_average_net_return = 0.0
minimum_average_net_return_ci_low = 0.0
minimum_average_excess_return_vs_spy = 0.0
minimum_average_excess_return_vs_spy_ci_low = 0.0
minimum_profit_factor = 1.05
maximum_drawdown = 0.20
minimum_stamped_round_trip_cost_bps = 10.0
maximum_process_memory_gib = 4.0
memory_guard_headroom_gib = 0.75

[swing]
strategy_id = "SWING.CROSS_SECTIONAL_MOMENTUM.5D.V2"
baseline_candidate_id = "deterministic_v1_baseline__expected_net_top_10"
dimensions = ["overall", "market_regime", "sector", "volatility_bucket"]
gross_return_column = "strategy_gross_return"
net_return_column = "strategy_net_return"
spy_excess_return_column = "strategy_excess_return_vs_spy"
mfe_column = "strategy_mfe"
mae_column = "strategy_mae"
period_column = "session_date_et"
row_id_column = "strategy_dataset_row_id"
volatility_column = "atr_pct_14"
volatility_low_upper_bound = 0.015
volatility_medium_upper_bound = 0.030

[intraday]
strategy_id = "INTRADAY.VWAP_REVERSION.30M.V2"
baseline_candidate_id = "multinomial_v1_baseline__no_veto_expected_net_top_10"
dimensions = [
  "overall",
  "market_regime",
  "sector",
  "volatility_bucket",
  "market_cap_bucket",
  "liquidity_bucket",
  "time_of_day",
]
gross_return_column = "path_realized_return_gross_30m"
net_return_column = "path_realized_return_net_30m"
spy_excess_return_column = "path_excess_return_30m_vs_spy"
mfe_column = "path_mfe_30m"
mae_column = "path_mae_30m"
period_column = "session_date_et"
row_id_column = "setup_id"
volatility_column = "atr_pct"
volatility_low_upper_bound = 0.010
volatility_medium_upper_bound = 0.025
opening_segment_end_et = "11:00"
midday_segment_end_et = "14:00"
