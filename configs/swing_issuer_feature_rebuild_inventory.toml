# Instructions only. Run in one PowerShell session from the repository root AFTER
# main confirms the active heavy job is finished and grants the sequential slot.
# Do not execute this inventory with Invoke-Expression or start another worker.
# Scoring completed at its recorded be8cc77c pin. Do not rerun [sentiment].command.
# [bounded_derivation].early_resume_command/later_command are the remaining
# preceding commands; check $LASTEXITCODE after each one.
# Both old generations are derived ONCE, never again for each month. Their CLI
# final JSON provides manifest_sha256. The score CLI publishes a completed
# _manifest.json rather than returning its external file hash; after its successful
# 661-row, zero-failure completion, record that file's Get-FileHash SHA256 once.
# Supply the two completed derivation hashes as variables below; the accepted
# corrected scoring hash is fixed explicitly. Never obtain
# a replacement expected hash merely because replay of an existing input failed.
construct_config_powershell = '''
Set-Location C:/project/market-predictor
$ErrorActionPreference = 'Stop'
# Required inputs from successful completed derivations:
# $earlyManifestSha, $laterManifestSha
$correctedSentimentManifestSha = 'be8cc77ca15fb79555d11ffd36f3737a0a1142a81fa987a7c6465821cb1aad6f'
function Assert-IssuerInputPin([string]$Path, [string]$Expected) {
    if ($Expected -notmatch '^[0-9a-fA-F]{64}$') { throw "Missing recorded SHA256: $Path" }
    $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
    if ($actual -ne $Expected.ToLowerInvariant()) { throw "Recorded source pin differs: $Path" }
}
$outcomeConfigSha = 'ded3b30af1185c7ab0759fa5f81c559c37c590419751c942b61ab479e67c2348'
$lineagePolicySha = 'b9d5d25b9b5dcd453a3b014e4946d6b29a3cf85dea75333b997cf95eb51466a0'
Assert-IssuerInputPin 'configs/swing_corrected_outcomes.toml' $outcomeConfigSha
Assert-IssuerInputPin 'configs/catalyst_lineage.toml' $lineagePolicySha
Assert-IssuerInputPin 'data/research/issuer_initial_fit_early_saved_v1/_manifest.json' $earlyManifestSha
Assert-IssuerInputPin 'data/research/issuer_initial_fit_later_saved_v1/_manifest.json' $laterManifestSha
Assert-IssuerInputPin 'data/research/swing_issuer_news_corrections_sentiment_finbert_v1/_manifest.json' $correctedSentimentManifestSha
$prepConfig = 'data/research/swing_initial_fit_monthly_lineage_preparation_v1.json'
$prepOut = 'data/research/swing_initial_fit_monthly_lineage_inputs_v1'
$indexOut = 'data/research/swing_initial_fit_catalyst_months_v1'
# This object is the exact reviewed JSON configuration shape. No extra keys.
$prepInput = [ordered]@{
    schema = 'swing.initial_fit_monthly_lineage_preparation.v1'
    decisions = @{ path = 'configs/swing_corrected_outcomes.toml'; sha256 = $outcomeConfigSha }
    policy = @{ path = 'configs/catalyst_lineage.toml'; sha256 = $lineagePolicySha }
    sources = [ordered]@{
        early = @{
            kind = 'derived'
            directory = 'data/research/issuer_initial_fit_early_saved_v1'
            manifest_sha256 = $earlyManifestSha.ToLowerInvariant()
        }
        later = @{
            kind = 'derived'
            directory = 'data/research/issuer_initial_fit_later_saved_v1'
            manifest_sha256 = $laterManifestSha.ToLowerInvariant()
        }
        corrected = @{
            kind = 'corrected'
            collection = @{
                directory = 'data/raw/swing_issuer_news_corrections'
                manifest_sha256 = '4da07ce57bf864845b79b0043816e49c104dc047eb81a30372ad952519f855d8'
            }
            attribution = @{
                directory = 'data/research/swing_issuer_news_corrections_attribution_v1'
                manifest_sha256 = 'ccf3a5ea9a8c057672579be230ece1a7aabac7f4067f12beba3c98d411cbf93e'
            }
            sentiment = @{
                directory = 'data/research/swing_issuer_news_corrections_sentiment_finbert_v1'
                manifest_sha256 = $correctedSentimentManifestSha.ToLowerInvariant()
            }
            audit = @{
                path = 'data/reports/swing_issuer_news_corrections_audit.json'
                sha256 = 'b4875e7cbf3334a346fff3047b5202c0c21a0801c473e01fcd9d7110bd202ecb'
            }
        }
    }
}
$json = $prepInput | ConvertTo-Json -Depth 10
# CreateNew prevents accidental overwrite; write UTF-8 without BOM for json.load.
$absolutePrepConfig = Join-Path (Get-Location).Path $prepConfig
$stream = [System.IO.File]::Open($absolutePrepConfig, [System.IO.FileMode]::CreateNew)
try {
    $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($json)
    $stream.Write($bytes, 0, $bytes.Length)
} finally {
    $stream.Dispose()
}
$prepConfigSha = (Get-FileHash -LiteralPath $prepConfig -Algorithm SHA256).Hash.ToLowerInvariant()
Write-Output "Preparation config SHA256: $prepConfigSha"
'''

# Even the estimator enters Darwin's root/data/runtime heavy lease. Wait for main's
# slot; it reads decision/source metadata, not numeric sentiment, and writes no output.
estimate_command = '''
& .venv\Scripts\python.exe -B -m market_predictor.swing.datasets.issuer_news_preparation --root C:/project/market-predictor --config $prepConfig --expected-config-sha256 $prepConfigSha --out-dir $prepOut --estimate-only
if ($LASTEXITCODE -ne 0) { throw 'Monthly preparation estimate failed; do not continue' }
'''

prepare_command = '''
& .venv\Scripts\python.exe -B -m market_predictor.swing.datasets.issuer_news_preparation --root C:/project/market-predictor --config $prepConfig --expected-config-sha256 $prepConfigSha --out-dir $prepOut | Tee-Object -Variable prepLines
if ($LASTEXITCODE -ne 0) { throw 'Monthly preparation failed; retain its recorded checkpoint pin' }
$prepResult = @($prepLines)[-1] | ConvertFrom-Json
Assert-IssuerInputPin (Join-Path $prepOut '_manifest.json') $prepResult.manifest_sha256
$monthlyConfig = $prepResult.publication_config
$monthlyConfigSha = $prepResult.publication_config_sha256
Assert-IssuerInputPin $monthlyConfig $monthlyConfigSha
if ($prepResult.rows -ne 586305) { throw 'Full corrected canonical population differs' }
# Record prepResult.manifest_sha256 and monthlyConfigSha externally. Do not rebuild
# or hand-edit monthly-publication.json: it already binds actual child source paths,
# policy hashes, full monthly canonical IDs, and verified compact monthly lineages.
'''

publish_index_command = '''
& .venv\Scripts\python.exe -B -m market_predictor.swing.datasets.issuer_news_publication --root C:/project/market-predictor --config $monthlyConfig --expected-config-sha256 $monthlyConfigSha --out-dir $indexOut | Tee-Object -Variable indexLines
if ($LASTEXITCODE -ne 0) { throw 'Monthly index publication failed; retain its recorded checkpoint pin' }
$indexResult = @($indexLines)[-1] | ConvertFrom-Json
Assert-IssuerInputPin (Join-Path $indexOut '_manifest.json') $indexResult.manifest_sha256
# Hand main indexOut plus indexResult.manifest_sha256, not an unpinned directory.
'''

# These are alternatives to their corresponding fresh command, not extra jobs.
# Supply the checkpoint SHA256 printed before interruption, or the already recorded
# completed manifest SHA256 for immutable replay. Keep every original config/source
# pin unchanged; do not blindly hash a damaged checkpoint to manufacture acceptance.
prepare_resume_command = '''
if ($prepCheckpointSha -notmatch '^[0-9a-fA-F]{64}$') { throw 'Recorded preparation checkpoint/manifest pin required' }
& .venv\Scripts\python.exe -B -m market_predictor.swing.datasets.issuer_news_preparation --root C:/project/market-predictor --config $prepConfig --expected-config-sha256 $prepConfigSha --out-dir $prepOut --expected-existing-manifest-sha256 $prepCheckpointSha | Tee-Object -Variable prepLines
if ($LASTEXITCODE -ne 0) { throw 'Monthly preparation resume failed' }
# Run the result extraction/pin checks from prepare_command, then publish_index_command.
'''
index_resume_command = '''
if ($indexCheckpointSha -notmatch '^[0-9a-fA-F]{64}$') { throw 'Recorded index checkpoint/manifest pin required' }
& .venv\Scripts\python.exe -B -m market_predictor.swing.datasets.issuer_news_publication --root C:/project/market-predictor --config $monthlyConfig --expected-config-sha256 $monthlyConfigSha --out-dir $indexOut --expected-existing-manifest-sha256 $indexCheckpointSha | Tee-Object -Variable indexLines
if ($LASTEXITCODE -ne 0) { throw 'Monthly index resume failed' }
# Run the result extraction/pin checks from publish_index_command.
'''

[monthly_preparation.final_join_interface]
index_api = "load_monthly_catalyst_index(Path(indexOut), expected_manifest_sha256=indexResult.manifest_sha256)"
index_immutable_file = "data/research/swing_initial_fit_catalyst_months_v1/_manifest.json"
full_population = "index.rows=586305; each month.rows and decision_ids_sha256 bind all canonical decisions, not event-assigned rows"
sparse_authority = "month.catalyst_decision_rows may be smaller; require unique subset IDs with no foreign IDs, not full equality"
authority_pin = "month.authority_sha256 hashes the actual month/_authority.json; month.manifest_sha256 separately hashes month/_manifest.json"
path_resolution = "month.directory relative to index directory; source_files and decision paths repo-relative"
consumer = "load each month authority then existing build_swing_ablation_rows over the full canonical month; preserve nullable unknowns and existing known-zero semantics"
excluded_contracts = "no old combined authority, no old canonical decisions, no outcomes as features, no implicit SEC/Finviz completeness, no new family features or model training"
