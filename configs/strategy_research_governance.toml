schema_version = "market_predictor.strategy_research_governance.v1"
maximum_development_experiments_per_strategy_version = 12
maximum_estimator_families_per_strategy_version = 4
maximum_feature_profiles_per_strategy_version = 3
maximum_selection_policies_per_strategy_version = 2
maximum_shadow_attempts_per_strategy_version = 1
required_validation_scopes = ["purged_walk_forward", "unseen_ticker_holdout"]
allowed_estimator_families = [
  "deterministic_baseline",
  "logistic",
  "hist_gradient_boosting",
  "direct_ranker",
]
allowed_feature_profiles = [
  "technical_only",
  "catalyst_only",
  "technical_plus_catalyst",
]
allowed_selection_policies = [
  "model_score_only",
  "catalyst_confirmation_overlay",
]
retirement_triggers = [
  "development_budget_exhausted_without_gate_pass",
  "frozen_hypothesis_fails_both_validation_scopes",
  "required_data_contract_invalidated",
  "shadow_attempt_consumed_without_promotion",
  "semantic_change_requires_new_strategy_version",
]
minimum_label_round_trip_cost_bps = 10.0
maximum_process_memory_gib = 5.0
swing_purge_rule = "label_horizon_sessions"
minimum_intraday_embargo_sessions = 1

