schema_version = "edge_rebuild.strategy_contract.v1"

# Frozen once, before any validation outcome is seen. Every number here is
# chosen from trading rationale and the design window only. Changing one after
# looking at validation results is the failure that produced the V2 rejection.

[swing]
strategy_id = "SWING.SECTOR_RESIDUAL_MOMENTUM.10D.V1"
# Decide after the completed daily bar, enter at the next session open, exit at
# the close of the tenth exchange session. Exit is timeout-only: a daily-bar
# strategy cannot know when an intraday stop was touched, and pretending
# otherwise would score fills the data cannot support.
horizon_sessions = 10
entry_reference = "next_session_open"
exit_rule = "horizon_close"
decision_cutoff = "daily_bar_close"
# Ten sessions rather than five. One round trip costs roughly 20 bps, so a
# five-session hold must clear that in a week; doubling the hold halves the cost
# burden per unit of expected move without assuming longer is better.
round_trip_cost_bps = 20.0
minimum_warmup_sessions = 250
maximum_trades_per_decision = 10
minimum_expected_net_edge_bps = 5.0

[intraday]
strategy_id = "INTRADAY.VWAP_EXHAUSTION_REVERSAL.30M.V1"
# Decide on a completed five-minute bar, finalize after 60 seconds, enter at the
# next one-minute open, exit at target, stop, or the thirtieth regular-session
# minute, whichever comes first.
horizon_minutes = 30
entry_reference = "next_one_minute_open"
exit_rule = "target_stop_timeout"
decision_finalization_seconds = 60
round_trip_cost_bps = 10.0
# Standard day-trade sizing is a 1.5 ATR stop with a 2.0 ATR target, a 1.33:1
# reward-to-risk. A stop tighter than one average range is hit by ordinary noise
# rather than by the thesis failing, which bleeds the account on randomness.
# ATR is measured on the trading timeframe: the published multiples assume that,
# and a daily ATR applied to a thirty-minute hold would make the stop
# unreachable and silently turn this into a timeout-only strategy.
target_atr_multiple = 2.0
stop_atr_multiple = 1.5
atr_timeframe = "5Min"
atr_lookback_bars = 14
minimum_warmup_bars = 130
maximum_trades_per_session = 5
minimum_expected_net_edge_bps = 3.0
# Opening, midday, and late sessions behave differently. A single unconditional
# VWAP-distance rule ignoring this is what V2 did, and it produced negative
# gross return before costs.
session_segments = ["opening", "midday", "late"]
opening_end_et = "11:00"
midday_end_et = "14:00"

[intraday_universe]
# Standard day-trading practice selects stocks in two layers, not one. Layer one
# is which stocks could be traded at all; layer two is which are actually moving
# today. Measured on our own corpus, only 3.8% of eligible stock-days clear
# relative volume 2.0, so an unconditional population is 96% stocks that were
# not moving. Training on those teaches nothing and is the likely reason the V2
# intraday setup showed negative gross return before costs.
#
# This is event-based sampling: sample when something happens, not on a fixed
# clock. See docs/active_edge_rebuild_plan.md for sources.
scope = "broad_us_point_in_time"
# The most intraday-tradable names are frequently high-beta mid caps, recent
# listings, and catalyst-driven movers that are not index constituents, so the
# intraday universe is deliberately not the S&P 500. Swing remains index-based.
index_restricted = false

# Layer one: could this be traded intraday at all.
minimum_average_volume_shares = 1_000_000
average_volume_lookback_sessions = 20
minimum_price = 5.0
maximum_price = 500.0
minimum_bar_continuity = 0.95

# Layer two: is it in play today. Evaluated from the prior session's data only,
# so selection never uses information from the session being traded.
minimum_relative_volume = 2.0
relative_volume_lookback_sessions = 20
relative_volume_excludes_current_session = true
maximum_candidates_per_session = 30

[methodology]
# Established methods, not invented ones. Each is named so a reviewer can check
# the implementation against the published definition.
labeling = "triple_barrier"
cross_validation = "purged_k_fold_with_embargo"
sampling = "event_based"
# Meta-labeling separates trade direction from trade sizing. It is a documented
# improvement but is deferred until one strategy passes admission on its own,
# because it adds a second model to validate.
meta_labeling_enabled = false

[labels]
# Benchmark excess is measured over the identical executable interval as the
# stock return, and is already net of cost. It is never re-deducted.
retained = [
  "gross_return",
  "cost",
  "net_return",
  "spy_excess_return",
  "sector_excess_return",
]
benchmark_market = "SPY"
benchmark_sector_source = "point_in_time_membership"

[validation]
purged_folds = 4
minimum_test_sessions_per_fold = 60
embargo_sessions = 10
unseen_ticker_holdout_fraction = 0.2
unseen_ticker_assignment = "deterministic_hash"

[experiment_budget]
# Trying many variants until one passes is how a random result becomes a
# "discovery". The budget is the multiple-testing control.
maximum_learned_candidates = 6
maximum_feature_profiles = 2
maximum_selection_policies = 2
shadow_retries = 0

[features]
# Four groups, kept apart. Extended-hours bars never reach a regular-session
# VWAP, moving average, ATR, or relative-volume denominator, because thin
# pre-market prints are real trades but do not represent broad agreement.
profiles = ["technical_market", "catalyst_full"]
promotion_eligible_profile = "catalyst_full"
extended_context_enabled = true
# Raw event counts trend upward across the sample because provider news
# coverage grew, not because issuers made more news. Counts must be compared
# within a decision cross-section or against the ticker's own recent history.
news_count_normalization = "cross_sectional_rank"
raw_news_counts_prohibited = true
# Sentiment decays from an impulse rather than switching off at a window edge.
# Frozen here and never tuned on validation results.
#
# Intraday: published work finds the news-sentiment effect is concentrated in
# the opening minutes and retains some predictive value to roughly six hours.
# A ninety-minute half-life leaves about 6% of the impulse at six hours, which
# matches that shape. Because the effect is front-loaded rather than uniform,
# decay alone is insufficient: the feature set must also carry time-since-news
# and which session segment the decision falls in.
sentiment_decay_half_life_minutes_intraday = 90.0
# Swing: PROVISIONAL, and weaker evidence than every other number here. The
# sentiment-decay literature describes an intraday effect that fades after the
# first session, which does not support a multi-day half-life. The mechanism
# that actually persists over a ten-session horizon is post-announcement drift,
# which is a different effect and is not a decayed sentiment score. This value
# exists so the feature can be built; whether decayed sentiment belongs in a
# ten-day strategy at all is an ER4 question, and catalyst remains an overlay
# until a preregistered ablation says otherwise.
sentiment_decay_half_life_hours_swing = 36.0
swing_sentiment_decay_evidence = "provisional_pending_er4_ablation"

[stress]
# Costs are widened, not the signal, to test whether the edge survives worse
# fills than the base policy assumes.
cost_multiplier = 2.0

[retirement]
# One rule, declared before any result is seen.
rule = "a strategy version failing any ER3 admission gate is retired; its thresholds and cohorts are not re-searched on the same data"
